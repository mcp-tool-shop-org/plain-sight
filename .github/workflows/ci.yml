name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      # No model cache needed: the CI-safe suite validates BEFORE any model
      # load by design — Florence-2 (~1.5 GB) is never downloaded here. The
      # dogfood suite (real model + GPU) runs locally only.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency scan (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Verify imports and tool registration
        run: |
          echo "[1/3] Import check..."
          python -c "from plain_sight.server import mcp; from plain_sight.engine import Florence2Engine; print('  imports OK')"
          echo "[2/3] Tool registration check..."
          python -c "
          import asyncio
          from plain_sight.server import mcp
          tools = asyncio.run(mcp.list_tools())
          expected = {'describe_image', 'describe_batch', 'read_text', 'sight_status', 'sight_selftest'}
          names = {t.name for t in tools}
          assert names == expected, f'Expected {expected}, got {names}'
          print(f'  {len(names)} tools registered OK')
          "
          echo "[3/3] Engine status check..."
          python -c "
          from plain_sight.engine import Florence2Engine
          e = Florence2Engine(device='cpu', dtype=None)
          s = e.status()
          assert s['model_id'], 'model_id missing'
          assert s['detail_tiers'], 'detail tiers missing'
          print('  engine OK: model=' + s['model_id'])
          "

      - name: Run edge-case tests
        run: pytest -m "not dogfood" -v
